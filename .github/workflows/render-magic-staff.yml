name: Render The Wildheart

on:
  push:
    branches: [main]
    paths:
      - "render_magic_staff.py"
      - ".github/workflows/render-magic-staff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wildheart-render
  cancel-in-progress: false

jobs:
  preview:
    name: Blender preview and visual check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout scene
        uses: actions/checkout@v4

      - name: Install preview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon0 libsm6 libxi6 libxrender1 libxxf86vm1

      - name: Download and verify Blender 4.5.15 LTS
        shell: bash
        run: |
          set -euo pipefail
          FILE="blender-4.5.15-linux-x64.tar.xz"
          BASE="https://download.blender.org/release/Blender4.5"
          curl -fL --retry 4 --retry-delay 3 "$BASE/$FILE" -o "$FILE"
          curl -fsSL "$BASE/blender-4.5.15.sha256" -o blender.sha256
          EXPECTED="$(grep "$FILE" blender.sha256 | awk '{print $1}' | head -n1)"
          test -n "$EXPECTED"
          echo "$EXPECTED  $FILE" | sha256sum --check -
          tar -xf "$FILE"
          BLENDER_DIR="$(find . -maxdepth 1 -type d -name 'blender-4.5.15*' | head -n1)"
          test -x "$BLENDER_DIR/blender"
          echo "BLENDER_BIN=$BLENDER_DIR/blender" >> "$GITHUB_ENV"

      - name: Render 3 diagnostic frames
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          set -euo pipefail
          mkdir -p output
          xvfb-run -a -s "-screen 0 1920x1080x24" "$BLENDER_BIN"             -b --threads 2 --python render_magic_staff.py -- --output-dir output --preview-only
          test -s output/check/check_0001.png
          test -s output/check/check_0240.png
          test -s output/check/check_0480.png

      - name: Build visual contact sheet
        run: |
          set -euo pipefail
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel warning -y             -i output/check/check_0001.png             -i output/check/check_0240.png             -i output/check/check_0480.png             -filter_complex "[0:v][1:v][2:v]hstack=inputs=3[stack]"             -map "[stack]" -frames:v 1 output/visual_check.png

      - name: Upload preview proof
        uses: actions/upload-artifact@v4
        with:
          name: wildheart-visual-check
          path: |
            output/visual_check.png
            output/check/check_0001.png
            output/check/check_0240.png
            output/check/check_0480.png
            output/wildheart_staff.blend
          if-no-files-found: error
          retention-days: 7
